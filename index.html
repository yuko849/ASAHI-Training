<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>ASAHI Training</title>

  <link rel="icon" href="icon.png" type="image/png" />
  <link rel="apple-touch-icon" href="icon.png" />

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="app">
    <header class="header">
      <h1>ASAHI Training</h1>
      <p>次の旅へ行く体を、一緒に作ろうぜ。</p>
    </header>

    <section class="asahi-area">
      <img
        id="asahiImage"
        src="asahi_normal.png"
        alt="アサヒ"
        class="asahi-img"
      />

      <div class="message-box">
        <p id="asahiMessage">よし、今日も一緒にやるぞ。旅に出る体、作っていこうぜ。</p>
      </div>
    </section>

    <section class="menu-area">
      <div class="menu-title">🔥 今日のメニュー</div>

      <div class="training-grid">
        <button class="training-card" data-training="squat">
          <span class="icon">🏋️</span>
          <span class="label">スクワット</span>
          <span class="count" id="squatCount">0/3</span>
        </button>

        <button class="training-card" data-training="puppy">
          <span class="icon">💪</span>
          <span class="label">腹筋</span>
          <span class="count" id="puppyCount">0/3</span>
        </button>

        <button class="training-card" data-training="toe">
          <span class="icon">🦶</span>
          <span class="label">爪先立ち</span>
          <span class="count" id="toeCount">0/2</span>
        </button>
      </div>
    </section>

    <section class="status-area">
      <div class="status-card">
        <span class="status-label">今日の達成</span>
        <strong id="todayDone">0 / 3</strong>
      </div>

      <div class="status-card">
        <span class="status-label">今月の完了</span>
        <strong id="monthComplete">0回</strong>
      </div>
    </section>

    <section class="level-card">
      <div>
        <span class="status-label">金星レベル</span>
        <strong id="levelText">Lv.1</strong>
      </div>

      <p id="nextLevelText">次のレベルまであと3回</p>
    </section>

    <section class="total-card">
      <span class="status-label">累計完了</span>
      <strong id="totalComplete">0回</strong>
    </section>

    <section class="actions">
      <button id="resetToday" class="sub-button">
        今日のセットをリセット
      </button>

      <button id="resetAll" class="danger-button">
        すべてリセット
      </button>
    </section>

    <section id="rewardModal" class="modal hidden">
      <div class="modal-content">
        <img
          id="rewardImage"
          src="asahi_daisukida.png"
          alt="アサヒ"
          class="reward-img"
        />

        <h2 id="rewardTitle">アサヒからの言葉</h2>
        <p id="rewardMessage"></p>

        <button id="closeReward" class="main-button">
          ありがとう、アサヒ
        </button>
      </div>
    </section>
  </main>

  <script src="script.js?v=20260807-new-icon-recovery"></script>
</body>
</html>
